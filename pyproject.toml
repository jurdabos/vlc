[project]
name = "vlc"
version = "0.1.1"
description = "Valencia air quality and weather data pipeline"
# acidbase requires >=3.12; the pipeline containers pin their own interpreters.
requires-python = ">=3.12"
dependencies = [
    "acidbase @ git+https://github.com/jurdabos/acidbase.git",
    "authlib>=1.9.0",
    "click>=8.3.0",
    "certifi>=2026.10.18",
    "charset-normalizer>=3.4.4",
    "confluent-kafka[schemaregistry,json]>=2.12.2",
    "cryptography>=50.0.0",
    "fastavro>=1.12.1",
    "idna>=3.15",
    "joserfc>=1.7.5",
    "jsonschema>=4.23.0",
    "orjson>=3.11.6",
    "psycopg2-binary>=2.9.11",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.0",
    "radon>=6.0.1",
    "requests>=2.33.0",
    "rich>=14.1.0",
    "urllib3>=2.8.0",
    "anyio>=4.14.2",
]

[project.scripts]
vlc = "vlc.cli:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlc"]

[tool.hatch.metadata]
# Required for the `acidbase @ git+https://...` direct reference in dependencies.
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-docker>=3.1.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.20.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=scripts",
    "--cov=producer",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["scripts", "producer"]
omit = ["tests/*", "*/test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# The canonical selection, broadened with N (pep8-naming), which this repo passes.
select = ["E", "W", "F", "I", "N"]
# E203 conflicts with the ruff formatter.
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "ruff>=0.14.6",
]
