# Alertmanager configuration template
# Secrets are injected via envsubst by sync-dev-secrets.sh
global:
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      continue: true

receivers:
  - name: "default"
    email_configs:
      - to: "${SMTP_USER}"
        send_resolved: true

  - name: "critical"
    email_configs:
      - to: "${SMTP_USER}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
