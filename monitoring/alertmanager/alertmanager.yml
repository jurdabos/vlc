# Alertmanager configuration template
# scripts/sync-dev-secrets.sh renders this into alertmanager.generated.yml with envsubst.
global:
  smtp_smarthost: "smtp.gmail.com:465"
  smtp_from: "${SMTP_USER}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  # Port 465 is encrypted from the first byte and offers no STARTTLS, which require_tls demands.
  # So this skips that upgrade only: the connection stays encrypted.
  smtp_require_tls: false

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      continue: true

receivers:
  - name: "default"
    email_configs:
      - to: "${SMTP_TO}"
        send_resolved: true

  - name: "critical"
    email_configs:
      - to: "${SMTP_TO}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
