name: vlc
version: "1.0.0"
config-version: 2

profile: vlc

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-end:
  - "{{ grant_select_to_vlc_dev() }}"

# Freshness classification thresholds — the single source of truth for
# per-station staleness boundaries. 'Offline' (> freshness_offline_max)
# matches the 5 h WeatherStationStale Grafana alert threshold.
vars:
  freshness_fresh_max: "1 hour"
  freshness_offline_max: "5 hours"
  # Physical plausibility bounds — the single source of truth for measurement
  # validity, consumed by the stg_*__clean models and the range tests.
  # Readings outside a bound are nulled (not dropped) in the clean layer.
  # humidity_pct max is 105, not 100: supersaturation and sensor calibration
  # tolerance make values up to ~105 % legitimate — see
  # docs/relative_humidity_above_100.txt.
  weather_validity_bounds:
    temperature_c: {min: -10, max: 50}
    humidity_pct: {min: 1, max: 105}
    pressure_hpa: {min: 940, max: 1070}
    wind_speed_ms: {min: 0, max: 60}
    wind_dir_deg: {min: 0, max: 360}
    precip_mm: {min: 0, max: 120}
  air_validity_bounds:
    no2: {min: 0, max: 1000}
    o3: {min: 0, max: 500}
    so2: {min: 0, max: 2000}
    co: {min: 0, max: 100}
    pm10: {min: 0, max: 1000}
    pm25: {min: 0, max: 500}
  # Spike rules: a reading deviating more than max_delta from the previous
  # reading (within window_minutes) is a sensor glitch when the next reading
  # either agrees with the previous one (V-shape) or is missing/outside the
  # window. Catches single-reading faults that sit inside the static bounds:
  #   * temperature_c: the -7.8 degC reading at W02_NAZARET_10m on
  #     2026-05-15 (a 27 degC drop in 10 minutes; the only such jump in
  #     ~193k rows).
  #   * pressure_hpa: single-point excursions of the W02 barometer failure
  #     of 2026-05 (e.g. 949 hPa between 928 and 966 neighbours). Real
  #     sea-level pressure never moves 15 hPa within 30 minutes; only 8
  #     such deltas exist in ~11k close-gap pairs, all glitches.
  # Sustained failure episodes (sensor stuck/oscillating for hours) are NOT
  # caught by design — they surface in public.data_quality instead.
  weather_spike_rules:
    temperature_c: {max_delta: 10, window_minutes: 30}
    pressure_hpa: {max_delta: 15, window_minutes: 30}

models:
  vlc:
    +materialized: view
