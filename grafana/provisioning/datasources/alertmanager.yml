apiVersion: 1

datasources:
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: true
    jsonData:
      implementation: prometheus
      # Forwarding Grafana-managed alerts (e.g. WeatherStationStale) to this
      # Alertmanager so they reuse the existing email routing
      handleGrafanaManagedAlerts: true
