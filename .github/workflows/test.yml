name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'

    - name: Install ruff
      # Pin ruff so CI uses the same version as the lockfile/dev group;
      # otherwise unpinned `pip install ruff` pulls newer versions whose
      # formatter may apply additional rewrites (e.g. lambda paren stripping
      # introduced in 0.15.x) and breaks CI even when local checks pass.
      run: pip install "ruff==0.14.6"

    - name: Lint Python code
      run: ruff check producer/ scripts/ src/ tests/

    - name: Check Python formatting
      run: ruff format --check producer/ scripts/ src/ tests/

  test:
    name: Unit Tests
    runs-on: windows-latest
    needs: lint

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        # 3.10 -> 3.12: the acidbase dependency (vlc CLI push workflow) requires >=3.12.
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Run unit tests
      run: pytest tests/unit/ -v --tb=short

    - name: Generate coverage report
      run: pytest tests/unit/ --cov --cov-report=xml --cov-report=html

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

  dbt-compile:
    name: dbt Compile
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'

    - name: Install dbt-postgres
      run: pip install dbt-postgres~=1.9.0

    - name: Install dbt packages
      run: dbt deps --project-dir dbt --profiles-dir dbt

    - name: Compile dbt project (parse-only)
      run: dbt parse --project-dir dbt --profiles-dir dbt
      env:
        DBT_PGPASSWORD: placeholder

  validate-config:
    name: Validate Connect Configs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'

    - name: Install jsonschema
      run: pip install jsonschema

    - name: Validate JSON syntax
      run: |
        for f in connect/config/*.json; do
          echo "Validating $f..."
          python -m json.tool "$f" > /dev/null
        done

    - name: Validate against schema
      run: |
        python -c "
        import json
        import jsonschema
        from pathlib import Path

        schema_file = Path('connect/config/jdbc-sink.schema.json')
        schema = json.loads(schema_file.read_text())

        for config_file in Path('connect/config').glob('jdbc-sink.timescale.*.json'):
            print(f'Validating {config_file.name}...')
            config = json.loads(config_file.read_text())
            jsonschema.validate(instance=config, schema=schema)
            print(f'  ✓ {config_file.name} is valid')
        "
